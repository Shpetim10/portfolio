# Daily refresh of the FIELD LOG contribution graph.
# Re-runs portfolio/scripts/fetch-github.mjs and commits the generated github.json;
# the push to main triggers the Vercel deploy, so the live graph is at most a day old.
name: Refresh GitHub contributions

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off the top of the hour, when Actions is busiest)
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: portfolio

concurrency:
  group: refresh-github
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch contribution snapshot
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          # A personal access token with the read:user scope, so private contributions count too.
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: node scripts/fetch-github.mjs --strict

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/content/generated/github.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/generated/github.json
          git commit -m "chore: refresh generated GitHub data"
          git push
